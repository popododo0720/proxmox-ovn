name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install Debian 13 prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates file git make python3 systemd
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: make fmt-check vet test build package-check
  web:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install Debian 13 prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git make
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-test web-build ui-test
  package:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install Debian 13 prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates file git make python3 systemd
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: pvn-node-deb
          path: dist/*.deb
          if-no-files-found: error
