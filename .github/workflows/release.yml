name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container: debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
    steps:
      - name: Install Debian 13 prerequisites
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          ca-certificates file gcc gh git libc6-dev make python3 systemd

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.13'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          release_version=${GITHUB_REF_NAME#v}
          release_commit=$(git rev-parse --verify "${GITHUB_REF_NAME}^{commit}")
          if [[ $(git rev-parse HEAD) != "$release_commit" ]]; then
            printf 'checked-out commit does not match release tag: %s\n' \
              "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          source_date_epoch=$(git show -s --format=%ct "$release_commit")
          if [[ ! $source_date_epoch =~ ^[0-9]+$ ]]; then
            printf 'release commit has an invalid timestamp\n' >&2
            exit 1
          fi
          printf 'PVN_RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
          printf 'PVN_RELEASE_ARCH=%s\n' "$(dpkg --print-architecture)" >> "$GITHUB_ENV"
          printf 'PVN_RELEASE_COMMIT_SHA=%s\n' "$release_commit" >> "$GITHUB_ENV"
          printf 'PVN_RELEASE_COMMIT=%s\n' "${release_commit:0:12}" >> "$GITHUB_ENV"
          printf 'PVN_RELEASE_BUILD_DATE=%s\n' \
            "$(date -u -d "@$source_date_epoch" +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"
          COMMIT=${release_commit:0:12} \
            BUILD_DATE=$(date -u -d "@$source_date_epoch" +%Y-%m-%dT%H:%M:%SZ) \
            SOURCE_DATE_EPOCH=$source_date_epoch \
            make release-source-check DEB_VERSION="$release_version"

      - name: Claim canonical release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_commit=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')
          if [[ $remote_commit != "$PVN_RELEASE_COMMIT_SHA" ]]; then
            printf 'remote release tag moved from build commit: %s != %s\n' \
              "$remote_commit" "$PVN_RELEASE_COMMIT_SHA" >&2
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
              --title "PVN $GITHUB_REF_NAME"
          fi
          release_state=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json author,isDraft,isPrerelease,tagName \
            --jq '[.author.login, .isDraft, .isPrerelease, .tagName] | @tsv')
          IFS=$'\t' read -r release_author release_is_draft \
            release_is_prerelease release_tag_name <<< "$release_state"
          if [[ $release_author != 'github-actions[bot]' ]]; then
            printf 'release was not created by the canonical publisher: %s\n' \
              "$release_author" >&2
            exit 1
          fi
          if [[ $release_is_draft != true && $release_is_draft != false ]]; then
            printf 'existing release has invalid draft state: %s\n' \
              "$release_is_draft" >&2
            exit 1
          fi
          if [[ $release_is_prerelease != false || \
              $release_tag_name != "$GITHUB_REF_NAME" ]]; then
            printf 'existing release has invalid tag or prerelease state\n' >&2
            exit 1
          fi
          verify_asset_uploaders() {
            local asset_api_prefix asset_api_url asset_api_urls asset_id asset_record
            local asset_name asset_uploader
            asset_api_prefix="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/"
            asset_api_urls=$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | (.apiUrl // "")')
            if [[ -z $asset_api_urls ]]; then
              return 0
            fi
            while IFS= read -r asset_api_url; do
              if [[ $asset_api_url != "$asset_api_prefix"* ]]; then
                printf 'release asset has an invalid API URL: %s\n' \
                  "$asset_api_url" >&2
                exit 1
              fi
              asset_id=${asset_api_url#"$asset_api_prefix"}
              if [[ ! $asset_id =~ ^[0-9]+$ ]]; then
                printf 'release asset has an invalid API ID: %s\n' \
                  "$asset_id" >&2
                exit 1
              fi
              asset_record=$(gh api \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                --jq '[.name, (.uploader.login // "")] | @tsv')
              IFS=$'\t' read -r asset_name asset_uploader <<< "$asset_record"
              if [[ $asset_uploader != 'github-actions[bot]' ]]; then
                printf 'release asset was not uploaded by the canonical publisher: %s (%s)\n' \
                  "$asset_name" "${asset_uploader:-missing}" >&2
                exit 1
              fi
            done <<< "$asset_api_urls"
          }
          verify_asset_uploaders

      - name: Run release source gates
        run: make fmt-check vet test test-race release-check-test

      - name: Build and verify release
        run: >-
          make release
          DEB_VERSION="$PVN_RELEASE_VERSION"
          COMMIT="$PVN_RELEASE_COMMIT"
          BUILD_DATE="$PVN_RELEASE_BUILD_DATE"

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            SHA256SUMS
            pvn-cluster-install
            pvn-cluster-lease
            pvn-cluster-update
            pvn-install.sh
            "pvn-node_${PVN_RELEASE_VERSION}_${PVN_RELEASE_ARCH}.deb"
            pvn-update.sh
          )
          payloads=(
            pvn-cluster-install
            pvn-cluster-lease
            pvn-cluster-update
            pvn-install.sh
            "pvn-node_${PVN_RELEASE_VERSION}_${PVN_RELEASE_ARCH}.deb"
            pvn-update.sh
          )
          mapfile -t actual < <(
            find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if (( ${#actual[@]} != ${#wanted[@]} )); then
            printf 'unexpected release assets:\n' >&2
            printf '  %s\n' "${actual[@]}" >&2
            exit 1
          fi
          for index in "${!wanted[@]}"; do
            if [[ ${actual[$index]} != "${wanted[$index]}" ]]; then
              printf 'unexpected release assets:\n' >&2
              printf '  %s\n' "${actual[@]}" >&2
              exit 1
            fi
          done
          for asset in "${expected[@]}"; do
            [[ -f "dist/$asset" && ! -L "dist/$asset" ]] || {
              printf 'release asset is missing or unsafe: %s\n' "$asset" >&2
              exit 1
            }
          done
          manifest=()
          while IFS= read -r line || [[ -n $line ]]; do
            if [[ $line =~ ^[0-9a-f]{64}[[:space:]][[:space:]]([A-Za-z0-9._+~-]+)$ ]]; then
              manifest+=("${BASH_REMATCH[1]}")
            else
              printf 'invalid SHA256SUMS entry: %s\n' "$line" >&2
              exit 1
            fi
          done < dist/SHA256SUMS
          mapfile -t manifest < <(printf '%s\n' "${manifest[@]}" | LC_ALL=C sort)
          mapfile -t payloads < <(printf '%s\n' "${payloads[@]}" | LC_ALL=C sort)
          if (( ${#manifest[@]} != ${#payloads[@]} )); then
            printf 'SHA256SUMS does not cover the exact payload set\n' >&2
            exit 1
          fi
          for index in "${!payloads[@]}"; do
            if [[ ${manifest[$index]} != "${payloads[$index]}" ]]; then
              printf 'SHA256SUMS does not cover the exact payload set\n' >&2
              exit 1
            fi
          done
          (cd dist && sha256sum --check --strict SHA256SUMS)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_names=(
            SHA256SUMS
            pvn-cluster-install
            pvn-cluster-lease
            pvn-cluster-update
            pvn-install.sh
            "pvn-node_${PVN_RELEASE_VERSION}_${PVN_RELEASE_ARCH}.deb"
            pvn-update.sh
          )
          is_expected_name() {
            local candidate=$1 expected
            for expected in "${expected_names[@]}"; do
              [[ $candidate == "$expected" ]] && return 0
            done
            return 1
          }
          verify_remote_tag() {
            local remote_commit
            remote_commit=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')
            if [[ $remote_commit != "$PVN_RELEASE_COMMIT_SHA" ]]; then
              printf 'remote release tag moved from build commit: %s != %s\n' \
                "$remote_commit" "$PVN_RELEASE_COMMIT_SHA" >&2
              exit 1
            fi
          }
          verify_asset_uploaders() {
            local asset_api_prefix asset_api_url asset_api_urls asset_id asset_record
            local asset_name asset_uploader
            asset_api_prefix="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/"
            asset_api_urls=$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | (.apiUrl // "")')
            if [[ -z $asset_api_urls ]]; then
              return 0
            fi
            while IFS= read -r asset_api_url; do
              if [[ $asset_api_url != "$asset_api_prefix"* ]]; then
                printf 'release asset has an invalid API URL: %s\n' \
                  "$asset_api_url" >&2
                exit 1
              fi
              asset_id=${asset_api_url#"$asset_api_prefix"}
              if [[ ! $asset_id =~ ^[0-9]+$ ]]; then
                printf 'release asset has an invalid API ID: %s\n' \
                  "$asset_id" >&2
                exit 1
              fi
              asset_record=$(gh api \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                --jq '[.name, (.uploader.login // "")] | @tsv')
              IFS=$'\t' read -r asset_name asset_uploader <<< "$asset_record"
              if [[ $asset_uploader != 'github-actions[bot]' ]]; then
                printf 'release asset was not uploaded by the canonical publisher: %s (%s)\n' \
                  "$asset_name" "${asset_uploader:-missing}" >&2
                exit 1
              fi
            done <<< "$asset_api_urls"
          }
          verify_release_provenance() {
            local release_author
            release_author=$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --json author \
              --jq '.author.login')
            if [[ $release_author != 'github-actions[bot]' ]]; then
              printf 'release was not created by the canonical publisher: %s\n' \
                "$release_author" >&2
              exit 1
            fi
            verify_asset_uploaders
          }

          verify_remote_tag
          if ! release_state=$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName \
              --jq '[.isDraft, .isPrerelease, .tagName] | @tsv' \
              2>/dev/null); then
            printf 'canonical release draft is missing after the claim step\n' >&2
            exit 1
          fi
          IFS=$'\t' read -r release_is_draft release_is_prerelease \
            release_tag_name <<< "$release_state"
          if [[ $release_is_draft != true && $release_is_draft != false ]]; then
            printf 'existing release has invalid draft state: %s\n' \
              "$release_is_draft" >&2
            exit 1
          fi
          if [[ $release_is_prerelease != false ]]; then
            printf 'existing release unexpectedly is a prerelease\n' >&2
            exit 1
          fi
          if [[ $release_tag_name != "$GITHUB_REF_NAME" ]]; then
            printf 'existing release has wrong tag: %s\n' \
              "$release_tag_name" >&2
            exit 1
          fi
          verify_release_provenance

          existing_output=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, .state] | @tsv')
          existing_names=()
          declare -A existing_assets=()
          if [[ -n $existing_output ]]; then
            while IFS=$'\t' read -r existing_name existing_state; do
              if ! is_expected_name "$existing_name"; then
                printf 'existing release has unexpected asset: %s\n' \
                  "$existing_name" >&2
                exit 1
              fi
              if [[ $existing_state != uploaded ]]; then
                printf 'existing release asset is not uploaded: %s (%s)\n' \
                  "$existing_name" "$existing_state" >&2
                exit 1
              fi
              if [[ ${existing_assets["$existing_name"]+present} ]]; then
                printf 'existing release has duplicate asset: %s\n' \
                  "$existing_name" >&2
                exit 1
              fi
              existing_names+=("$existing_name")
              existing_assets["$existing_name"]=1
            done <<< "$existing_output"
          fi
          if [[ $release_is_draft == false ]] && \
              (( ${#existing_names[@]} != ${#expected_names[@]} )); then
            printf 'published release is incomplete and cannot be mutated\n' >&2
            exit 1
          fi

          existing_dir=$(mktemp -d)
          final_dir=$(mktemp -d)
          cleanup() {
            rm -rf "$existing_dir" "$final_dir"
          }
          trap cleanup EXIT HUP INT TERM

          for existing_name in "${existing_names[@]}"; do
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --pattern "$existing_name" \
              --dir "$existing_dir"
            if ! cmp -s "dist/$existing_name" "$existing_dir/$existing_name"; then
              printf 'existing release asset does not match build: %s\n' \
                "$existing_name" >&2
              exit 1
            fi
          done

          for expected_name in "${expected_names[@]}"; do
            if [[ ${existing_assets["$expected_name"]+present} ]]; then
              continue
            fi
            if [[ $release_is_draft != true ]]; then
              printf 'published release is missing immutable asset: %s\n' \
                "$expected_name" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "dist/$expected_name" \
              --repo "$GITHUB_REPOSITORY"
          done

          final_output=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, .state] | @tsv')
          final_names=()
          if [[ -n $final_output ]]; then
            while IFS=$'\t' read -r final_name final_state; do
              if [[ $final_state != uploaded ]]; then
                printf 'release asset is not uploaded: %s (%s)\n' \
                  "$final_name" "$final_state" >&2
                exit 1
              fi
              final_names+=("$final_name")
            done <<< "$final_output"
          fi
          mapfile -t final_names < <(
            printf '%s\n' "${final_names[@]}" | LC_ALL=C sort
          )
          mapfile -t expected_names < <(
            printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort
          )
          if (( ${#final_names[@]} != 7 )); then
            printf 'release does not contain exactly seven assets\n' >&2
            exit 1
          fi
          for index in "${!expected_names[@]}"; do
            if [[ ${final_names[$index]} != "${expected_names[$index]}" ]]; then
              printf 'release asset set is not exact\n' >&2
              exit 1
            fi
          done

          for expected_name in "${expected_names[@]}"; do
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --pattern "$expected_name" \
              --dir "$final_dir"
            if ! cmp -s "dist/$expected_name" "$final_dir/$expected_name"; then
              printf 'release asset does not match build: %s\n' \
                "$expected_name" >&2
              exit 1
            fi
          done
          verify_release_provenance

          if [[ $release_is_draft == true ]]; then
            verify_remote_tag
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft=false
          fi
          final_state=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName \
            --jq '[.isDraft, .isPrerelease, .tagName] | @tsv')
          IFS=$'\t' read -r final_is_draft final_is_prerelease \
            final_tag_name <<< "$final_state"
          if [[ $final_is_draft != false || $final_is_prerelease != false || \
              $final_tag_name != "$GITHUB_REF_NAME" ]]; then
            printf 'release was not published after validation\n' >&2
            exit 1
          fi
