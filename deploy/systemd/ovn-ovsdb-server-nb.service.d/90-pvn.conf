[Unit]
Requires=pvn-central-preflight.service
After=pvn-central-preflight.service
PartOf=pvn-central.target
ConditionPathExists=/etc/pvn/central/enabled

[Service]
EnvironmentFile=/etc/pvn/central/ovn-central.env
EnvironmentFile=/etc/pvn/central/ovn-listeners.env
ExecStartPost=/usr/lib/pvn/pvn-ovn-db-listeners nb
TimeoutStartSec=120
