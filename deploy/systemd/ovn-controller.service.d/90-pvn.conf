[Unit]
Requires=pvn-ovn-host-config.service
After=pvn-ovn-host-config.service
PartOf=pvn-node.target
ConditionPathExists=/etc/pvn/node-enabled
ConditionPathExists=/etc/pve/pvn/config.json
ConditionPathExists=/etc/pvn/pki/ca.pem
ConditionPathExists=/etc/pvn/pki/node.pem
ConditionPathExists=/etc/pvn/pki/node-key.pem

[Service]
EnvironmentFile=/etc/pvn/ovn-host.env
