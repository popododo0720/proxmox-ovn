[Unit]
Requires=pvn-central-preflight.service pvn-ovn-db-listeners.service
After=pvn-central-preflight.service pvn-ovn-db-listeners.service
PartOf=pvn-central.target
ConditionPathExists=/etc/pvn/central/enabled

[Service]
EnvironmentFile=/etc/pvn/central/ovn-central.env
ExecStart=
ExecStart=/usr/lib/pvn/pvn-ovn-northd start
